  <style>
    :root{--violet:#8c5cff;--cyan:#48e8ff;--pink:#ff67d4;--ink:#07031a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink)}body{font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;color:#fff;overflow-x:hidden}
    main{position:relative;isolation:isolate;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 17%,rgba(140,92,255,.34),transparent 32%),radial-gradient(circle at 8% 80%,rgba(72,232,255,.17),transparent 34%),radial-gradient(circle at 95% 72%,rgba(255,103,212,.16),transparent 30%),linear-gradient(155deg,#03020d 0%,#0d0630 50%,#06142a 100%)}
    main:before{content:"";position:absolute;z-index:-3;inset:-40%;background-image:linear-gradient(rgba(108,224,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(108,224,255,.055) 1px,transparent 1px);background-size:44px 44px;transform:perspective(480px) rotateX(62deg) translateY(27%);mask-image:linear-gradient(to bottom,transparent 15%,#000 72%)}
    main:after{content:"";position:absolute;z-index:-2;width:680px;height:680px;border-radius:50%;border:1px solid rgba(91,231,255,.15);box-shadow:0 0 90px rgba(126,81,255,.16),inset 0 0 90px rgba(72,232,255,.08);animation:halo 9s linear infinite}
    .stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:81px 97px;opacity:.35}.stars:before{transform:translate(31px,19px);background-size:113px 127px;opacity:.4}.stars:after{transform:translate(-17px,47px);background-size:151px 163px;opacity:.25}
    .orb{position:absolute;border-radius:50%;filter:blur(1px);animation:drift 6s ease-in-out infinite}.orb.a{width:10px;height:10px;top:13%;left:11%;background:var(--cyan);box-shadow:0 0 24px var(--cyan)}.orb.b{width:7px;height:7px;top:23%;right:12%;background:var(--pink);box-shadow:0 0 22px var(--pink);animation-delay:-2s}.orb.c{width:8px;height:8px;bottom:15%;left:15%;background:#aa7cff;box-shadow:0 0 22px #aa7cff;animation-delay:-4s}
    .panel{position:relative;width:min(470px,100%);padding:27px 24px 25px;text-align:center;border:1px solid transparent;border-radius:34px;background:linear-gradient(rgba(8,5,30,.88),rgba(5,12,32,.94)) padding-box,linear-gradient(135deg,rgba(72,232,255,.75),rgba(140,92,255,.68) 48%,rgba(255,103,212,.62)) border-box;box-shadow:0 28px 90px rgba(0,0,0,.58),0 0 55px rgba(124,81,255,.18),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px)}.panel:before{content:"";position:absolute;inset:10px;border:1px solid rgba(126,222,255,.08);border-radius:25px;pointer-events:none}
    .ai-badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:15px;padding:7px 13px;border:1px solid rgba(72,232,255,.28);border-radius:999px;background:rgba(72,232,255,.07);color:#a9f5ff;font-size:11px;font-weight:800;letter-spacing:.2em}.ai-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:blink 1.2s infinite}
    .portrait-wrap{position:relative;width:190px;height:190px;margin:0 auto 21px;display:grid;place-items:center}.portrait-wrap:before,.portrait-wrap:after{content:"";position:absolute;border-radius:50%;animation:spin 10s linear infinite}.portrait-wrap:before{inset:-7px;border:2px solid transparent;background:conic-gradient(from 0deg,var(--cyan),transparent 20%,var(--violet) 38%,transparent 58%,var(--pink) 76%,transparent 90%,var(--cyan)) border-box;mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);mask-composite:exclude;filter:drop-shadow(0 0 9px rgba(72,232,255,.75))}.portrait-wrap:after{inset:-17px;border:1px dashed rgba(182,146,255,.55);animation-direction:reverse;animation-duration:17s}
    .portrait{width:174px;height:174px;object-fit:cover;border-radius:50%;display:block;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 5px rgba(124,81,255,.18),0 0 42px rgba(72,232,255,.24)}
    .brand{margin:0;font-size:clamp(28px,8.4vw,43px);line-height:1.12;font-weight:950;letter-spacing:.025em;color:#fff;text-shadow:0 0 12px rgba(112,224,255,.38),0 5px 28px rgba(0,0,0,.6)}.brand .name{display:inline-block;background:linear-gradient(90deg,#a7f7ff,#d3b8ff 48%,#ffb3e8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(123,222,255,.28))}
    .signal{display:flex;align-items:center;gap:10px;margin:16px auto 15px;color:rgba(214,230,255,.48);font-size:10px;letter-spacing:.15em}.signal:before,.signal:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(72,232,255,.55))}.signal:after{transform:scaleX(-1)}
    h1{margin:0;font-size:clamp(34px,10.2vw,52px);line-height:1.08;font-weight:950;letter-spacing:-.045em;color:#fff;text-wrap:balance;text-shadow:0 4px 20px rgba(0,0,0,.5)}h1 .ai{display:inline-block;margin-right:.08em;color:#06101c;background:linear-gradient(135deg,#d9ffff,#57e8ff 52%,#a48cff);padding:.02em .16em .08em;border-radius:.18em;box-shadow:0 0 24px rgba(72,232,255,.42);animation:aiGlow 2s ease-in-out infinite}h1 .accent{display:block;margin-top:5px;background:linear-gradient(90deg,#fff 0%,#d9c7ff 28%,#ff8fdd 62%,#70efff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
    .copy{margin:22px 0 12px;color:#d9e1ff;font-size:14px;font-weight:700;letter-spacing:.08em}.track{position:relative;height:10px;overflow:hidden;border:1px solid rgba(120,225,255,.16);border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}.bar{height:100%;width:8%;border-radius:inherit;transition:width .2s ease;background:linear-gradient(90deg,var(--violet),var(--cyan) 58%,#fff);box-shadow:0 0 18px var(--cyan)}
    .status{display:flex;align-items:center;justify-content:space-between;margin-top:11px;color:rgba(211,220,255,.62);font-size:12px}.status span{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 1.2s infinite}.percent{color:#8ff4ff;font-weight:900}.note{margin:20px 0 0;padding-top:17px;border-top:1px solid rgba(255,255,255,.08);color:rgba(215,221,255,.42);font-size:11px;letter-spacing:.04em}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes halo{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateY(-18px) scale(1.2)}}@keyframes blink{50%{opacity:.3;transform:scale(.72)}}@keyframes aiGlow{50%{box-shadow:0 0 38px rgba(72,232,255,.72);transform:translateY(-2px)}}@keyframes shine{to{background-position:200% center}}
    @media(max-width:480px){.panel{padding:24px 19px 22px;border-radius:29px}.portrait-wrap{width:164px;height:164px;margin-bottom:19px}.portrait{width:150px;height:150px}.brand{font-size:clamp(27px,8.3vw,38px)}h1{font-size:clamp(34px,10.8vw,47px)}}@media(max-height:700px){.panel{padding-top:18px;padding-bottom:18px}.portrait-wrap{width:135px;height:135px;margin-bottom:14px}.portrait{width:123px;height:123px}.ai-badge{margin-bottom:10px}.signal{margin:11px auto}.copy{margin-top:15px}.note{margin-top:14px;padding-top:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
  </style>
