<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>旺99-最敢送最敢開No.1</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#00111b}body{font-family:"Microsoft JhengHei",Arial,sans-serif}
    main{min-height:100svh;display:grid;place-items:center;overflow:hidden;position:relative;padding:20px;color:#fff7cf;background:radial-gradient(circle at 50% 26%,rgba(255,202,69,.17),transparent 29%),radial-gradient(circle at 14% 78%,rgba(0,133,185,.26),transparent 34%),linear-gradient(150deg,#01070a,#001722 56%,#002f49)}
    main:before{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px}
    .card{width:min(430px,100%);position:relative;z-index:1;padding:34px 30px 29px;text-align:center;border:1px solid rgba(255,220,111,.35);border-radius:32px;background:linear-gradient(155deg,rgba(2,22,31,.92),rgba(1,9,14,.96));box-shadow:0 32px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(18px)}
    .logo{width:170px;height:170px;margin:0 auto 23px;padding:5px;border-radius:38px;background:linear-gradient(140deg,#fff2a7,#c88813 42%,#ffdc65 72%,#81500a);box-shadow:0 16px 45px rgba(245,184,39,.25);animation:float 2.8s ease-in-out infinite}.logo img{width:100%;height:100%;object-fit:cover;border-radius:33px;display:block}
    .kicker{margin:0 0 10px;color:#e7bc55;font-size:13px;letter-spacing:.18em;font-weight:700}h1{margin:0;font-size:clamp(27px,7vw,36px);line-height:1.25;letter-spacing:-.035em;color:#fff}h1 span{color:#ffd86c}.copy{margin:24px 0 14px;color:rgba(255,255,255,.78);font-size:14px}
    .track{height:9px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.09)}.bar{height:100%;width:8%;border-radius:inherit;transition:width .2s ease;background:linear-gradient(90deg,#b9710c,#ffe594 52%,#d58a12);box-shadow:0 0 16px #ffc841}
    .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:rgba(255,255,255,.54);font-size:12px}.row span{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#59db94;box-shadow:0 0 9px #59db94;animation:pulse 1.3s infinite}.percent{color:#e9c362;font-weight:700}.note{margin:24px 0 0;padding-top:19px;border-top:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.37);font-size:11px}
    @keyframes float{50%{transform:translateY(-7px)}}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}@media(max-width:480px){.card{padding:28px 22px 24px}.logo{width:152px;height:152px}}
  </style>
</head>
<body>
<main><section class="card">
  <div class="logo"><img src="assets/wang99-logo.png" alt="旺99"></div>
  <p class="kicker">旺99 官方活動入口</p>
  <h1>最敢送・最敢開 <span>No.1</span></h1>
  <p class="copy" id="copy">正在建立安全連線</p>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="row"><span><i class="dot"></i>安全驗證中</span><b class="percent" id="percent">8%</b></div>
  <p class="note">系統將自動跳轉，請勿關閉此頁面</p>
</section></main>
<script>
(() => {
  const PIXEL_ID = "1522694286295350";
  const DESTINATION = "https://w599.tw/link/ttgh";
  const SITE_KEY = "wang99-meta3";
  const delay = 2400 + Math.floor(Math.random() * 401);
  let redirected = false, progress = 8;
  const destination = new URL(DESTINATION);
  new URLSearchParams(location.search).forEach((v,k) => { if(!destination.searchParams.has(k)) destination.searchParams.set(k,v); });
  const makeId = name => {
    const key = SITE_KEY + ":event:" + name;
    let id = sessionStorage.getItem(key);
    if(!id){ id = SITE_KEY + "-" + name + "-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random()); sessionStorage.setItem(key,id); }
    return id;
  };
  if(sessionStorage.getItem(SITE_KEY + ":sent") !== "1"){
    sessionStorage.setItem(SITE_KEY + ":sent","1");
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init",PIXEL_ID);
    fbq("track","PageView",{}, {eventID:makeId("pageview")});
    fbq("track","Contact",{}, {eventID:makeId("contact")});
    fbq("track","Lead",{}, {eventID:makeId("lead")});
  }
  const timer=setInterval(()=>{progress=Math.min(progress+7,94);document.getElementById("bar").style.width=progress+"%";document.getElementById("percent").textContent=progress+"%";},150);
  setTimeout(()=>document.getElementById("copy").textContent="即將為您開啟活動頁面",1050);
  setTimeout(()=>{if(redirected)return;redirected=true;clearInterval(timer);document.getElementById("bar").style.width="100%";document.getElementById("percent").textContent="100%";document.getElementById("copy").textContent="連線完成，正在前往";location.replace(destination.toString());},delay);
})();
</script>
</body>
</html>
